[package]
name = "litx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Isolated LiteParse Extended CLI scaffold"

[[bin]]
name = "litx"
path = "src/main.rs"

[dependencies]
liteparse = { path = "../../../crates/liteparse", features = ["tesseract"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
