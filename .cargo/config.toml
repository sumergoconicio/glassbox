[build]
# Share intermediates across the workspaces in this checkout. Cargo uses each
# workspace's target directory for its final artifacts.
build-dir = "target"

# WebAssembly SIMD (supported by every current browser, Node, Deno and Workers): tract, which runs
# the ocria-nano models in the WASM build, only compiles its simd128 kernels with it (~2x faster).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
